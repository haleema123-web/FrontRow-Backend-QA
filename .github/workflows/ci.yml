name: FrontRow Backend QA Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Start Backend Server
        run: |
          npm start > server.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://localhost:3000/events > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run QA Test Files
        run: |
          for test_file in tests/*.spec.js; do
            echo "Running $test_file"
            node --test "$test_file" || true
          done

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-logs
          path: server.log
          if-no-files-found: ignore